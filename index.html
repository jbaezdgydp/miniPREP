let actaDuplicadaBloqueo = false;
let currentUser = null;
let idCasillaAsignada = null;
let catalogoCasillas = []; // Guardará las 1,720 casillas
let nombreCapturista = ""; // Guardará el nombre del usuario

function showLoading(text) {
    document.getElementById('loadingText').innerText = text;
    document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
    document.getElementById('loadingOverlay').classList.add('hidden');
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    showLoading("Iniciando sesión...");
    const { data, error } = await cliente.auth.signInWithPassword({ email, password });
    
    if (error) {
        hideLoading();
        return alert("Error de acceso: " + error.message);
    }

    currentUser = data.user;

    // 1. Obtener nombre del capturista
    const { data: userData } = await cliente.from('usuarios').select('nombre_completo').eq('id_usuario', currentUser.id).single();
    nombreCapturista = userData?.nombre_completo || 'Capturista';

    // 2. Descargar catálogo completo de casillas (las 1720 de golpe)
    showLoading("Descargando catálogo de casillas...");
    const { data: casillasData, error: errCasillas } = await cliente.from('casillas').select('*');
    
    if (errCasillas) {
        hideLoading();
        return alert("Error al cargar el catálogo de casillas.");
    }
    
    catalogoCasillas = casillasData;
    idCasillaAsignada = null; 
    actualizarHeaderCapturista();

    // 3. Llenar el primer menú desplegable (Municipios)
    const municipios = [...new Set(catalogoCasillas.map(c => c.municipio))].filter(Boolean).sort();
    const selMun = document.getElementById('sel_municipio');
    selMun.innerHTML = '<option value="">Selecciona Municipio...</option>';
    municipios.forEach(m => selMun.innerHTML += `<option value="${m}">${m}</option>`);

    hideLoading();
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('captureView').classList.remove('hidden');
}

async function verificarDuplicado() {
            const casilla = idCasillaAsignada;
            const eleccion = document.getElementById('tipoEleccion').value;
            const alerta = document.getElementById('alertaDuplicado');
            
            // Solo consultamos si ya eligió ambas cosas
            if (!casilla || !eleccion) {
                actaDuplicadaBloqueo = false;
                alerta.classList.add('hidden');
                return;
            }

            // Consultar a la base de datos
            const { data, error } = await cliente
                .from('resultados_actas')
                .select('id_resultado')
                .eq('id_casilla', casilla)
                .eq('tipo_eleccion', eleccion)
                .limit(1);

            if (data && data.length > 0) {
                // Ya existe: Activamos el bloqueo y mostramos alerta
                actaDuplicadaBloqueo = true;
                alerta.classList.remove('hidden');
                alerta.innerHTML = `<i class="fas fa-exclamation-triangle mr-2 text-lg"></i> <b>¡ALTO!</b> El acta de <b>${eleccion}</b> para la casilla <b>${casilla}</b> YA FUE CAPTURADA en el sistema. Verifica con tu coordinador.`;
            } else {
                // No existe: Vía libre
                actaDuplicadaBloqueo = false;
                alerta.classList.add('hidden');
            }
            
            validarMatematica(); // Re-evaluamos el botón de envío
        }

async function logout() {
    if(confirm("¿Seguro que deseas salir?")) {
        await cliente.auth.signOut();
        location.reload();
    }
}

// VALIDACIÓN MATEMÁTICA EN TIEMPO REAL
function validarMatematica() {
    const inputs = document.querySelectorAll('.voto-input');
    let sumaCalculada = 0;
    inputs.forEach(input => {
        sumaCalculada += parseInt(input.value) || 0;
    });

    const totalActaInput = document.getElementById('totalActa');
    const totalActa = parseInt(totalActaInput.value);
    const container = document.getElementById('validacionContainer');
    const mensaje = document.getElementById('mensajeValidacion');
    const btnEnviar = document.getElementById('btnEnviar');

    if (actaDuplicadaBloqueo) {
                btnEnviar.disabled = true;
                btnEnviar.classList.replace('bg-green-600', 'bg-gray-400');
                contenedor.classList.replace('bg-green-100', 'bg-gray-100');
                contenedor.classList.replace('border-green-500', 'border-gray-300');
                mensaje.innerText = "Captura bloqueada por acta duplicada.";
                mensaje.classList.replace('text-green-700', 'text-gray-500');
                return;
            }

    if (isNaN(totalActa)) {
        container.className = "bg-gray-100 p-4 rounded-lg border-2 border-gray-300 mt-6";
        mensaje.innerHTML = `Ingresa el total para validar.`;
        mensaje.className = "mt-3 text-sm font-bold text-center text-gray-500";
        btnEnviar.disabled = true;
        btnEnviar.className = "w-full bg-gray-400 text-white font-bold py-4 rounded-lg mt-8 shadow-lg flex justify-center items-center";
        return;
    }

    if (sumaCalculada === totalActa) {
        container.className = "bg-green-50 p-4 rounded-lg border-2 border-green-500 mt-6";
        totalActaInput.className = "w-full border-2 border-green-500 rounded-lg p-3 text-center text-2xl font-black text-green-700 bg-white focus:outline-none";
        mensaje.innerHTML = `<i class="fas fa-check-circle"></i> ¡Cuadra perfectamente! (${sumaCalculada} votos)`;
        mensaje.className = "mt-3 text-sm font-bold text-center text-green-600";
        
        btnEnviar.disabled = false;
        btnEnviar.className = "w-full bg-pink-600 hover:bg-purple-700 text-white font-bold py-4 rounded-lg mt-8 shadow-xl transition-colors duration-300 flex justify-center items-center";
    } else {
        container.className = "bg-red-50 p-4 rounded-lg border-2 border-red-500 mt-6";
        totalActaInput.className = "w-full border-2 border-red-500 rounded-lg p-3 text-center text-2xl font-black text-red-700 bg-white focus:outline-none";
        mensaje.innerHTML = `<i class="fas fa-times-circle"></i> Discrepancia: La suma da ${sumaCalculada}, pero escribiste ${totalActa}.`;
        mensaje.className = "mt-3 text-sm font-bold text-center text-red-600";
        
        btnEnviar.disabled = true;
        btnEnviar.className = "w-full bg-gray-400 text-white font-bold py-4 rounded-lg mt-8 shadow-lg flex justify-center items-center cursor-not-allowed";
    }
}

function filtrarCasillas(nivel) {
    const mun = document.getElementById('sel_municipio').value;
    const com = document.getElementById('sel_comunidad').value;
    const sec = document.getElementById('sel_seccion').value;

    const selCom = document.getElementById('sel_comunidad');
    const selSec = document.getElementById('sel_seccion');
    const selCas = document.getElementById('sel_casilla');

    let filtradas = catalogoCasillas;

    if (nivel === 'municipio') {
        filtradas = filtradas.filter(c => c.municipio === mun);
        selCom.innerHTML = '<option value="">Selecciona Localidad/Comunidad...</option>';
        [...new Set(filtradas.map(c => c.comunidad))].filter(Boolean).sort().forEach(c => {
            selCom.innerHTML += `<option value="${c}">${c}</option>`;
        });
        
        selCom.disabled = !mun;
        selSec.disabled = true; selCas.disabled = true;
        selSec.innerHTML = '<option value="">Sección...</option>';
        selCas.innerHTML = '<option value="">Casilla...</option>';
        idCasillaAsignada = null;
    }

    if (nivel === 'comunidad') {
        filtradas = filtradas.filter(c => c.municipio === mun && c.comunidad === com);
        selSec.innerHTML = '<option value="">Sección...</option>';
        [...new Set(filtradas.map(c => c.seccion))].filter(Boolean).sort((a,b)=>a-b).forEach(s => {
            selSec.innerHTML += `<option value="${s}">${s}</option>`;
        });
        
        selSec.disabled = !com;
        selCas.disabled = true;
        selCas.innerHTML = '<option value="">Casilla...</option>';
        idCasillaAsignada = null;
    }

    if (nivel === 'seccion') {
        filtradas = filtradas.filter(c => c.municipio === mun && c.comunidad === com && c.seccion == sec);
        selCas.innerHTML = '<option value="">Casilla...</option>';
        filtradas.forEach(c => {
            selCas.innerHTML += `<option value="${c.id_casilla}">${c.tipo_casilla} (${c.id_casilla})</option>`;
        });
        
        selCas.disabled = !sec;
        idCasillaAsignada = null;
    }
    
    actualizarHeaderCapturista();
}

function confirmarCasilla() {
    idCasillaAsignada = document.getElementById('sel_casilla').value;
    actualizarHeaderCapturista();
    verificarDuplicado();
}

function actualizarHeaderCapturista() {
    const texto = idCasillaAsignada ? `Casilla: ${idCasillaAsignada}` : '⚠️ Falta seleccionar casilla';
    document.getElementById('casillaAsignadaText').innerText = `${texto} | ${nombreCapturista}`;
}

async function submitActa(e) {
    e.preventDefault();
    const tipoEleccionSeleccionada = document.getElementById('tipoEleccion').value;
    if (!idCasillaAsignada) {
            alert("⚠️ Debes asignar una casilla usando el buscador azul antes de enviar el acta.");
            return;
        }
        if (!tipoEleccionSeleccionada) {
            alert("Debes seleccionar el Tipo de Elección en la parte superior del formulario.");
            return;
        }

        const fotoFile = document.getElementById('fotoActa').files[0];
        if (!fotoFile) {
            alert("Debes tomar o subir la foto del acta.");
            return;
        }

        showLoading("Subiendo foto del acta...");

        try {
            // Generamos un nombre único que incluye el tipo de elección para que no se sobreescriban las fotos
            const fileExt = fotoFile.name.split('.').pop();
            const tipoLimpio = tipoEleccionSeleccionada.replace(/\s+/g, '_');
            const fileName = `${idCasillaAsignada}_${tipoLimpio}_${Date.now()}.${fileExt}`;
            
            const { data: uploadData, error: uploadError } = await cliente.storage
                .from('actas_prep')
                .upload(fileName, fotoFile, { cacheControl: '3600', upsert: false });

            if (uploadError) throw new Error("Error al subir foto: " + uploadError.message);

            const { data: publicUrlData } = cliente.storage
                .from('actas_prep')
                .getPublicUrl(fileName);
            
            const fotoUrl = publicUrlData.publicUrl;

            showLoading("Guardando resultados...");

            const { data: insertData, error: insertError } = await cliente
                .from('resultados_actas')
                .insert([
                    {
                        id_casilla: idCasillaAsignada,
                        id_usuario: currentUser.id,
                        tipo_eleccion: tipoEleccionSeleccionada,
                        votos_pan: parseInt(document.getElementById('v_pan').value) || 0,
                        votos_pri: parseInt(document.getElementById('v_pri').value) || 0,
                        votos_prdt: parseInt(document.getElementById('v_prd').value) || 0,
                        votos_pt: parseInt(document.getElementById('v_pt').value) || 0,
                        votos_pvem: parseInt(document.getElementById('v_pvem').value) || 0,
                        votos_mc: parseInt(document.getElementById('v_mc').value) || 0,
                        votos_morena: parseInt(document.getElementById('v_morena').value) || 0,
                        votos_pac: parseInt(document.getElementById('v_pac').value) || 0,
                        votos_rsp: parseInt(document.getElementById('v_rsp').value) || 0,
                        votos_fxm: parseInt(document.getElementById('v_fxm').value) || 0,
                        votos_somos_mexico: parseInt(document.getElementById('v_somos').value) || 0,
                        votos_paz: parseInt(document.getElementById('v_paz').value) || 0,
                        votos_nueva_alianza: parseInt(document.getElementById('v_panal').value) || 0,
                        votos_independiente: parseInt(document.getElementById('v_ind').value) || 0,
                        votos_no_registrados: parseInt(document.getElementById('v_noreg').value) || 0,
                        votos_nulos: parseInt(document.getElementById('v_nulos').value) || 0,
                        total_votos_acta: parseInt(document.getElementById('totalActa').value),
                        url_foto_acta: fotoUrl
                    }
                ]);

            if (insertError) {
                if(insertError.code === '23505') throw new Error(`Ya existe un acta de ${tipoEleccionSeleccionada} registrada para esta casilla.`);
                throw new Error("Error al guardar: " + insertError.message);
            }

            hideLoading();
            alert(`¡Acta de ${tipoEleccionSeleccionada} enviada exitosamente!`);
            
            // Limpiamos el formulario pero mantenemos al usuario en la misma pantalla por si va a capturar otra elección
            document.getElementById('actaForm').reset();
            validarMatematica();

        } catch (err) {
            hideLoading();
            alert(err.message);
        }
    
}
    </script>
